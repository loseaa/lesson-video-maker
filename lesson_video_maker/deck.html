<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[TITLE]]</title>
<link rel="stylesheet" href="deck.css">
<script id="timeline-data" type="application/json">[[DATA]]</script>
<script defer src="player.js"></script>
</head>
<body>
<main class="shell">
  <header>
    <h1 id="title">[[TITLE]]</h1>
  </header>
  <section class="stage" aria-label="演示画面">
    <canvas width="1920" height="1080" aria-label="当前技术动画"></canvas>
    <p class="visually-hidden" id="caption"></p>
  </section>
  <div class="transport" aria-label="演示控制">
    <button type="button" id="previous" aria-label="上一幕">‹</button>
    <button type="button" id="play" disabled>播放旁白</button>
    <button type="button" id="next" aria-label="下一幕">›</button>
    <input aria-label="播放进度" id="seek" type="range" min="0" max="0" step="0.01" value="0">
    <output id="time" aria-label="当前时间">0:00</output>
  </div>
  <nav aria-label="场景" class="chapters">[[SCENE_BUTTONS]]</nav>
  <p id="status" class="status" role="status" hidden></p>
  <audio preload="auto" src="narration.wav"></audio>
</main>
</body>
</html>
